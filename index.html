<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>विन गेम - Win Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #090e1a; color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 10px; }
    .box { width: 100%; max-width: 420px; background: #111927; border-radius: 14px; padding: 12px; border: 1px solid #1e293b; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .logo { font-size: 18px; font-weight: 800; color: #38bdf8; }
    .bal { background: #1e293b; padding: 5px 12px; border-radius: 15px; color: #facc15; font-weight: 700; font-size: 14px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .btn { padding: 8px; border: none; border-radius: 6px; font-weight: 700; color: #fff; cursor: pointer; text-align: center; font-size: 13px; }
    .timer-card { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; }
    .adv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0; background: rgba(30,58,138,0.2); padding: 8px; border-radius: 8px; }
    .adv-item { background: #172540; padding: 4px; border-radius: 6px; text-align: center; }
    .c-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .n-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
    .n-btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 15px; cursor: pointer; }
    .s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; padding: 6px 8px; background: #162032; border-radius: 6px; margin-top: 4px; font-size: 12px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .bg-g { background-color: #10b981; } .bg-r { background-color: #ef4444; } .bg-v { background-color: #a855f7; }
    .cg { color: #10b981; } .cr { color: #ef4444; } .cv { color: #ec4899; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 99; }
    .modal-content { background: #111927; padding: 16px; border-radius: 10px; width: 100%; max-width: 320px; text-align: center; }
    input { width: 100%; padding: 8px; margin: 6px 0; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; }
  </style>
</head>
<body>

<div class="box">
  <div class="header">
    <div>
      <div class="logo">🎮 विन गेम (Win Game)</div>
      <div style="font-size:10px;color:#64748b">UID: 981402</div>
    </div>
    <div class="bal">₹<span id="bal">1000.00</span></div>
  </div>

  <div class="actions">
    <button class="btn" style="background:#10b981" onclick="openM('depM')">➕ Deposit</button>
    <button class="btn" style="background:#ef4444" onclick="openM('withM')">➖ Withdraw</button>
  </div>

  <div class="timer-card">
    <div>
      <div style="font-size:10px;color:#94a3b8">पीरियड (Period)</div>
      <div id="pId" style="font-weight:700;color:#38bdf8">2026101000051350</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10px;color:#94a3b8">समय शेष</div>
      <div id="tBox" style="font-size:22px;font-weight:800;color:#facc15">00:30</div>
    </div>
  </div>

  <div style="font-size:11px;color:#60a5fa;font-weight:700">⚡ 5 सीजन आगे (Next 5 Results)</div>
  <div class="adv-grid" id="advGrid"></div>

  <div class="c-grid">
    <button class="btn" style="background:#10b981" onclick="bet('Green')">Green</button>
    <button class="btn" style="background:#8b5cf6" onclick="bet('Violet')">Violet</button>
    <button class="btn" style="background:#ef4444" onclick="bet('Red')">Red</button>
  </div>

  <div class="n-grid">
    <button class="n-btn cv" onclick="bet('0')">0</button>
    <button class="n-btn cg" onclick="bet('1')">1</button>
    <button class="n-btn cr" onclick="bet('2')">2</button>
    <button class="n-btn cg" onclick="bet('3')">3</button>
    <button class="n-btn cr" onclick="bet('4')">4</button>
    <button class="n-btn cv" onclick="bet('5')">5</button>
    <button class="n-btn cr" onclick="bet('6')">6</button>
    <button class="n-btn cg" onclick="bet('7')">7</button>
    <button class="n-btn cr" onclick="bet('8')">8</button>
    <button class="n-btn cg" onclick="bet('9')">9</button>
  </div>

  <div class="s-grid">
    <button class="btn" style="background:#f59e0b" onclick="bet('Big')">Big</button>
    <button class="btn" style="background:#3b82f6" onclick="bet('Small')">Small</button>
  </div>

  <div style="font-size:12px;color:#94a3b8;margin:8px 0 4px">Game History (रिकॉर्ड्स)</div>
  <div id="hList"></div>
</div>

<!-- Admin Panel -->
<div class="box" style="border:1px dashed #f59e0b">
  <div style="font-size:11px;color:#fbbf24;font-weight:700;margin-bottom:4px">⚙️ Admin: अगले 5 नंबर सेट करें</div>
  <input type="text" id="admInp" placeholder="उदा. 7, 2, 5, 8, 1">
  <button class="btn" style="background:#d97706;width:100%" onclick="setAdmin()">सेव करें</button>
</div>

<!-- Deposit Modal -->
<div class="modal" id="depM">
  <div class="modal-content">
    <h4>डिपॉजिट (Add Money)</h4>
    <input type="number" id="depAmt" placeholder="राशि दर्ज करें">
    <button class="btn" style="background:#10b981;width:100%;margin-top:6px" onclick="addMoney()">जमा करें</button><br><br>
    <button class="btn" style="background:#475569;width:100%" onclick="closeM('depM')">बंद करें</button>
  </div>
</div>

<!-- Withdraw Modal -->
<div class="modal" id="withM">
  <div class="modal-content">
    <h4>विड्रॉल (Withdraw)</h4>
    <input type="number" id="wAmt" placeholder="निकासी राशि">
    <button class="btn" style="background:#ef4444;width:100%;margin-top:6px" onclick="subMoney()">निकासी करें</button><br><br>
    <button class="btn" style="background:#475569;width:100%" onclick="closeM('withM')">बंद करें</button>
  </div>
</div>

<script>
  var bal = 1000;
  var sec = 30;
  var seq = 1350;
  var queue = [];

  function openM(id){ document.getElementById(id).style.display = 'flex'; }
  function closeM(id){ document.getElementById(id).style.display = 'none'; }

  function addMoney(){
    var a = Number(document.getElementById('depAmt').value);
    if(a > 0){
      bal += a;
      document.getElementById('bal').innerText = bal.toFixed(2);
      closeM('depM');
    }
  }

  function subMoney(){
    var a = Number(document.getElementById('wAmt').value);
    if(a > 0 && a <= bal){
      bal -= a;
      document.getElementById('bal').innerText = bal.toFixed(2);
      closeM('withM');
    }
  }

  function bet(x){
    if(bal >= 10){
      bal -= 10;
      document.getElementById('bal').innerText = bal.toFixed(2);
      alert('₹10 का दांव लगा: ' + x);
    } else {
      alert('बैलेंस कम है!');
    }
  }

  function getP(s){
    var d = new Date();
    var ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    return ymd + "0005" + s;
  }

  function getD(n){
    var sz = n >= 5 ? 'Big' : 'Small';
    var c = 'cr';
    var dot = '<span class="dot bg-r"></span>';
    if(n === 0){ c = 'cv'; dot = '<span class="dot bg-r"></span><span class="dot bg-v"></span>'; }
    else if(n === 5){ c = 'cv'; dot = '<span class="dot bg-g"></span><span class="dot bg-v"></span>'; }
    else if([1,3,7,9].indexOf(n) !== -1){ c = 'cg'; dot = '<span class="dot bg-g"></span>'; }
    return { sz: sz, c: c, dot: dot };
  }

  function fillQ(){
    while(queue.length < 5){
      queue.push(Math.floor(Math.random() * 10));
    }
    var g = document.getElementById('advGrid');
    g.innerHTML = '';
    for(var i = 0; i < queue.length; i++){
      var num = queue[i];
      var d = getD(num);
      g.innerHTML += '<div class="adv-item"><div style="font-size:9px;color:#94a3b8">+' + (i+1) + '</div><div class="' + d.c + '" style="font-size:15px;font-weight:800">' + num + '</div><div style="font-size:9px">' + d.sz + '</div></div>';
    }
  }

  function runRound(){
    var win = queue.shift();
    fillQ();
    var d = getD(win);
    var r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = '<div>' + getP(seq) + '</div><div class="' + d.c + '" style="text-align:center;font-weight:800">' + win + '</div><div style="text-align:center">' + d.sz + '</div><div style="text-align:right">' + d.dot + '</div>';
    document.getElementById('hList').prepend(r);
    seq++;
    document.getElementById('pId').innerText = getP(seq);
  }

  function setAdmin(){
    var v = document.getElementById('admInp').value;
    if(v.trim()){
      var parts = v.split(',');
      var arr = [];
      for(var i = 0; i < parts.length; i++){
        var n = Number(parts[i].trim());
        if(!isNaN(n) && n >= 0 && n <= 9) arr.push(n);
      }
      if(arr.length > 0){
        queue = arr.concat(queue).slice(0, 5);
        fillQ();
        document.getElementById('admInp').value = '';
      }
    }
  }

  fillQ();
  document.getElementById('pId').innerText = getP(seq);
  for(var k = 0; k < 3; k++){ runRound(); }

  setInterval(function(){
    sec--;
    if(sec < 0){
      runRound();
      sec = 30;
    }
    document.getElementById('tBox').innerText = '00:' + (sec < 10 ? '0' + sec : sec);
  }, 1000);
</script>
</body>
  </html>
