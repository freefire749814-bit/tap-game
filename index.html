<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Win Game - 1v1 Battle</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; padding: 20px; text-align: center; background: #121212; color: #fff; }
    .box { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
    input { width: 80%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; text-align: center; }
    button { padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin: 8px; }
    .btn-create { background: #ff9800; color: #000; }
    .btn-join { background: #2196f3; color: #fff; }
    .tap-btn { width: 100%; height: 180px; font-size: 32px; background: #4caf50; color: white; border-radius: 16px; margin-top: 15px; }
    .score-board { display: flex; justify-content: space-around; font-size: 20px; margin: 15px 0; }
    .score-box { background: #2c2c2c; padding: 10px 20px; border-radius: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="box">
    <h2>⚡ 1v1 Tap Battle ⚡</h2>

    <!-- रूम स्क्रीन -->
    <div id="lobby-screen">
      <input type="text" id="playerName" placeholder="अपना नाम लिखें" value="Player"><br>
      <button class="btn-create" onclick="createRoom()">कमरा बनाएँ (Create Room)</button>
      <hr style="border-color:#333; margin: 15px 0;">
      <input type="text" id="roomInput" placeholder="रूम कोड यहाँ डालें"><br>
      <button class="btn-join" onclick="joinRoom()">जुड़ें (Join Room)</button>
    </div>

    <!-- गेम स्क्रीन -->
    <div id="game-screen" class="hidden">
      <h3 id="roomDisplay"></h3>
      <p id="status">सामने वाले प्लेयर का इंतज़ार...</p>

      <div class="score-board">
        <div class="score-box">
          <div id="p1Label">P1</div>
          <b id="p1Score" style="color: #4caf50; font-size: 28px;">0</b>
        </div>
        <div class="score-box">
          <div id="p2Label">P2</div>
          <b id="p2Score" style="color: #2196f3; font-size: 28px;">0</b>
        </div>
      </div>

      <button id="tapBtn" class="tap-btn" onclick="handleTap()" disabled>TAP! TAP!</button>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAj6VzNnaZo_QV5Jz61Fna8IW9ijNiqiAk",
      authDomain: "tap-win-game-4d51d.firebaseapp.com",
      databaseURL: "https://tap-win-game-4d51d-default-rtdb.firebaseio.com",
      projectId: "tap-win-game-4d51d",
      storageBucket: "tap-win-game-4d51d.firebasestorage.app",
      messagingSenderId: "419963240402",
      appId: "1:419963240402:web:bc00f3ebb1af077480d20b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = null;
    let myRole = null; 
    const WIN_TARGET = 50;

    function createRoom() {
      const pName = document.getElementById("playerName").value || "Player 1";
      const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      currentRoom = roomCode;
      myRole = "p1";

      db.ref("rooms/" + roomCode).set({
        p1: { name: pName, score: 0 },
        status: "waiting"
      }).then(() => {
        openGameScreen(roomCode);
        listenRoom(roomCode);
      });
    }

    function joinRoom() {
      const code = document.getElementById("roomInput").value.trim();
      const pName = document.getElementById("playerName").value || "Player 2";
      if (!code) return alert("कृपया रूम कोड डालें!");

      currentRoom = code;
      myRole = "p2";

      const roomRef = db.ref("rooms/" + code);
      roomRef.once("value", (snap) => {
        if (!snap.exists()) {
          alert("गलत रूम कोड!");
          return;
        }
        roomRef.update({
          p2: { name: pName, score: 0 },
          status: "playing"
        }).then(() => {
          openGameScreen(code);
          listenRoom(code);
        });
      });
    }

    function openGameScreen(code) {
      document.getElementById("lobby-screen").classList.add("hidden");
      document.getElementById("game-screen").classList.remove("hidden");
      document.getElementById("roomDisplay").innerText = "रूम कोड: " + code;
    }

    function listenRoom(code) {
      db.ref("rooms/" + code).on("value", (snap) => {
        const data = snap.val();
        if (!data) return;

        if (data.p1) {
          document.getElementById("p1Label").innerText = data.p1.name;
          document.getElementById("p1Score").innerText = data.p1.score || 0;
        }
        if (data.p2) {
          document.getElementById("p2Label").innerText = data.p2.name;
          document.getElementById("p2Score").innerText = data.p2.score || 0;
        }

        const tapBtn = document.getElementById("tapBtn");
        const status = document.getElementById("status");

        if (data.status === "playing") {
          status.innerText = "मैच शुरू! जल्दी टैप करो (लक्ष्य: " + WIN_TARGET + ")";
          tapBtn.disabled = false;
        } else if (data.status === "finished") {
          status.innerText = "🎉 विजेता: " + data.winner + "!";
          tapBtn.disabled = true;
        }
      });
    }

    function handleTap() {
      if (!currentRoom || !myRole) return;
      const scoreRef = db.ref("rooms/" + currentRoom + "/" + myRole + "/score");
      
      scoreRef.transaction((score) => {
        return (score || 0) + 1;
      }, (error, committed, snapshot) => {
        if (committed && snapshot.val() >= WIN_TARGET) {
          const myName = document.getElementById("playerName").value;
          db.ref("rooms/" + currentRoom).update({
            status: "finished",
            winner: myName
          });
        }
      });
    }
  </script>
</body>
</html>
