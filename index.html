<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 Seasons Advance Predictor Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #080e1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 14px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background-color: #111a2e;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid #1e2c47;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    /* Header & Timer */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: linear-gradient(135deg, #1b2844, #0e1626);
      border-radius: 10px;
      border: 1px solid #2a3d66;
    }
    .period-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
    .period-val { font-size: 16px; font-weight: 700; color: #38bdf8; margin-top: 2px; }
    .timer-val { font-size: 26px; font-weight: 800; color: #facc15; }

    /* Upcoming 5 Seasons Box */
    .advance-box {
      border: 1px solid #3b82f6;
      background: rgba(30, 58, 138, 0.2);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }
    .advance-header {
      font-size: 13px;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .advance-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .adv-item {
      background: #172540;
      border: 1px solid #29406e;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
    }
    .adv-round { font-size: 10px; color: #94a3b8; }
    .adv-num { font-size: 18px; font-weight: 800; margin: 4px 0; }
    .adv-size { font-size: 10px; font-weight: 600; }

    /* History Table */
    .history-title {
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .table-head {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      padding: 8px 10px;
      color: #64748b;
      font-size: 12px;
      border-bottom: 1px solid #1e2c47;
    }
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      margin-top: 6px;
    }
    .row-item {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      align-items: center;
      padding: 9px 10px;
      background: #15223c;
      border-radius: 8px;
      font-size: 13px;
    }
    .rec-period { color: #94a3b8; font-size: 12px; }
    .rec-num { font-size: 18px; font-weight: 800; text-align: center; }
    .rec-size { font-weight: 700; text-align: center; }
    .rec-dots { display: flex; justify-content: flex-end; gap: 4px; }

    /* Color dots & styling */
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .bg-g { background-color: #10b981; }
    .bg-r { background-color: #ef4444; }
    .bg-v { background-color: #a855f7; }
    .c-green { color: #10b981; }
    .c-red { color: #ef4444; }
    .c-mix { color: #ec4899; }

    /* Admin Panel */
    .admin-card {
      width: 100%;
      max-width: 440px;
      background: #141f36;
      border: 1px dashed #f59e0b;
      border-radius: 12px;
      padding: 14px;
    }
    .admin-card h3 { font-size: 13px; color: #fbbf24; margin-bottom: 6px; }
    .admin-card input {
      width: 100%;
      padding: 8px 10px;
      background: #0b111e;
      border: 1px solid #2a3d66;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .admin-card button {
      width: 100%;
      padding: 9px;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Top Bar -->
  <div class="header-bar">
    <div>
      <div class="period-title">चल रहा पीरियड (Current)</div>
      <div class="period-val" id="currPeriod">--</div>
    </div>
    <div style="text-align: right;">
      <div class="period-title">समय शेष (Time)</div>
      <div class="timer-val" id="timerBox">00:30</div>
    </div>
  </div>

  <!-- Upcoming 5 Seasons Display -->
  <div class="advance-box">
    <div class="advance-header">
      <span>⚡ 5 सीजन आगे (Next 5 Results)</span>
      <span style="font-size: 11px; color: #93c5fd;">ऑटो-कैलकुलेटेड</span>
    </div>
    <div class="advance-grid" id="advanceGrid">
      <!-- 5 future rounds -->
    </div>
  </div>

  <!-- Game History Table -->
  <div class="history-title">Game History (रिकॉर्ड्स)</div>
  <div class="table-head">
    <div>पीरियड</div>
    <div style="text-align: center;">नंबर</div>
    <div style="text-align: center;">साइज</div>
    <div style="text-align: right;">कलर</div>
  </div>
  <div class="records-list" id="historyList"></div>
</div>

<!-- Admin Preset Queue -->
<div class="admin-card">
  <h3>⚙️ Admin: अगले 5 सीजन के नंबर खुद तय करें</h3>
  <input type="text" id="adminInput" placeholder="जैसे: 7, 2, 5, 8, 1">
  <button onclick="setAdmin5Seasons()">अगले 5 सीजन सेव करें</button>
</div>

<script>
  let seconds = 30;
  let currentSeq = 1350;
  
  // आगामी 5 सीजन की कतार (Queue)
  let futureQueue = [];

  function getPeriodStr(seq) {
    const d = new Date();
    const ymd = d.getFullYear().toString() +
      String(d.getMonth() + 1).padStart(2, '0') +
      String(d.getDate()).padStart(2, '0');
    return ymd + "0005" + seq;
  }

  function getDetails(n) {
    const size = n >= 5 ? 'Big' : 'Small';
    let cls = 'c-red';
    let dots = '<span class="dot bg-r"></span>';

    if (n === 0) {
      cls = 'c-mix';
      dots = '<span class="dot bg-r"></span><span class="dot bg-v"></span>';
    } else if (n === 5) {
      cls = 'c-mix';
      dots = '<span class="dot bg-g"></span><span class="dot bg-v"></span>';
    } else if ([1, 3, 7, 9].includes(n)) {
      cls = 'c-green';
      dots = '<span class="dot bg-g"></span>';
    }
    return { size, cls, dots };
  }

  // आगामी 5 रिजल्ट्स को हमेशा 5 की गिनती में बनाए रखना
  function refillQueue() {
    while (futureQueue.length < 5) {
      futureQueue.push(Math.floor(Math.random() * 10));
    }
    renderAdvanceGrid();
  }

  function renderAdvanceGrid() {
    const grid = document.getElementById('advanceGrid');
    grid.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const num = futureQueue[i];
      const d = getDetails(num);
      grid.innerHTML += `
        <div class="adv-item">
          <div class="adv-round">+${i + 1} राउंड</div>
          <div class="adv-num ${d.cls}">${num}</div>
          <div class="adv-size">${d.size}</div>
        </div>
      `;
    }
  }

  function completeRound() {
    // 5 सीजन आगे वाली लिस्ट में से पहला नंबर इस राउंड का रिजल्ट बनेगा
    const winningNum = futureQueue.shift();
    refillQueue();

    const d = getDetails(winningNum);
    const row = document.createElement('div');
    row.className = 'row-item';
    row.innerHTML = `
      <div class="rec-period">${getPeriodStr(currentSeq)}</div>
      <div class="rec-num ${d.cls}">${winningNum}</div>
      <div class="rec-size">${d.size}</div>
      <div class="rec-dots">${d.dots}</div>
    `;

    document.getElementById('historyList').prepend(row);
    currentSeq++;
    document.getElementById('currPeriod').innerText = getPeriodStr(currentSeq);
  }

  function setAdmin5Seasons() {
    const val = document.getElementById('adminInput').value;
    if (val.trim()) {
      const nums = val.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x) && x >= 0 && x <= 9);
      if (nums.length > 0) {
        futureQueue = nums.concat(futureQueue).slice(0, 5);
        refillQueue();
        document.getElementById('adminInput').value = '';
      }
    }
  }

  // इनिशियलाइज़
  refillQueue();
  document.getElementById('currPeriod').innerText = getPeriodStr(currentSeq);
  for (let i = 0; i < 3; i++) completeRound();

  // 30s टाइमर
  setInterval(() => {
    seconds--;
    if (seconds < 0) {
      completeRound();
      seconds = 30;
    }
    const s = seconds < 10 ? '0' + seconds : seconds;
    document.getElementById('timerBox').innerText = `00:${s}`;
  }, 1000);
</script>

</body>
</html>
