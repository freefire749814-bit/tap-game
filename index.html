<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>विन गेम - Win Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background-color: #090e1a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 10px; gap: 12px; }
    .app-container { width: 100%; max-width: 440px; background-color: #111927; border-radius: 16px; padding: 14px; border: 1px solid #1e293b; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #1e293b; }
    .logo-title { font-size: 20px; font-weight: 900; color: #38bdf8; }
    .user-uid { font-size: 11px; color: #64748b; }
    .wallet-pill { background: #1e293b; padding: 6px 14px; border-radius: 20px; color: #facc15; font-size: 15px; font-weight: 700; border: 1px solid #334155; }
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
    .btn-action { border: none; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 14px; color: #fff; cursor: pointer; }
    .btn-deposit { background: #10b981; }
    .btn-withdraw { background: #ef4444; }
    .round-card { display: flex; justify-content: space-between; align-items: center; background: #1e293b; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
    .period-title { font-size: 11px; color: #94a3b8; }
    .period-id { font-size: 15px; font-weight: 700; color: #38bdf8; margin-top: 2px; }
    .timer-digits { font-size: 26px; font-weight: 800; color: #facc15; }
    .advance-box { border: 1px solid #3b82f6; background: rgba(30,58,138,0.2); border-radius: 12px; padding: 10px; margin-bottom: 14px; }
    .adv-header { font-size: 12px; font-weight: 700; color: #60a5fa; margin-bottom: 8px; }
    .adv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .adv-item { background: #172540; border-radius: 8px; padding: 6px 2px; text-align: center; }
    .adv-round { font-size: 9px; color: #94a3b8; }
    .adv-num { font-size: 16px; font-weight: 800; margin: 2px 0; }
    .adv-size { font-size: 10px; font-weight: 600; }
    .color-bet-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .bet-btn { padding: 10px 4px; border-radius: 8px; border: none; font-weight: 800; color: #fff; cursor: pointer; }
    .btn-green { background: #10b981; }
    .btn-violet { background: #8b5cf6; }
    .btn-red { background: #ef4444; }
    .numbers-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
    .num-btn { background: #1e293b; border: 1px solid #334155; color: white; padding: 9px; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; }
    .size-bet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .btn-big { background: #f59e0b; color: #1e293b; font-size: 16px; font-weight: 800; padding: 10px; border-radius: 8px; border: none; }
    .btn-small { background: #3b82f6; color: white; font-size: 16px; font-weight: 800; padding: 10px; border-radius: 8px; border: none; }
    .table-head { display: grid; grid-template-columns: 2fr 1fr 1.2fr 1.2fr; padding: 8px 10px; color: #64748b; font-size: 12px; border-bottom: 1px solid #1e293b; }
    .records-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; margin-top: 6px; }
    .row-item { display: grid; grid-template-columns: 2fr 1fr 1.2fr 1.2fr; align-items: center; padding: 8px 10px; background: #162032; border-radius: 8px; font-size: 13px; }
    .rec-period { color: #94a3b8; font-size: 12px; }
    .rec-num { font-size: 17px; font-weight: 800; text-align: center; }
    .rec-size { font-weight: 700; text-align: center; }
    .rec-dots { display: flex; justify-content: flex-end; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .bg-g { background-color: #10b981; }
    .bg-r { background-color: #ef4444; }
    .bg-v { background-color: #a855f7; }
    .c-green { color: #10b981; }
    .c-red { color: #ef4444; }
    .c-mix { color: #ec4899; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; padding: 16px; z-index: 100; }
    .modal-box { width: 100%; max-width: 380px; background: #111827; border: 1px solid #374151; border-radius: 14px; padding: 18px; }
    .modal-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: white; margin-bottom: 10px; }
    .admin-card { width: 100%; max-width: 440px; background: #141f36; border: 1px dashed #f59e0b; border-radius: 12px; padding: 12px; }
  </style>
</head>
<body>
