<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Daily Tap Win</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
    .prize { background: #1e293b; padding: 12px; border-radius: 10px; color: #facc15; font-size: 14px; margin-bottom: 20px; }
    .score { font-size: 38px; font-weight: bold; color: #22c55e; margin-bottom: 30px; }
    .coin { width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle, #f59e0b, #b45309); border: 5px solid #fde047; display: inline-flex; align-items: center; justify-content: center; font-size: 65px; cursor: pointer; box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); margin: 0 auto; }
    .coin:active { transform: scale(0.93); }
    .leaderboard { margin-top: 30px; background: #1e293b; border-radius: 10px; padding: 15px; text-align: left; font-size: 13px; }
    .leaderboard h3 { color: #facc15; margin-bottom: 10px; font-size: 15px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="prize">🎁 <b>आज का इनाम: Top 10</b><br>🥇 1st: ₹1000 | 🥈 2nd: ₹500 | 🥉 3rd: ₹250</div>
  <div class="score">पॉइंट्स: <span id="score">0</span></div>
  <div class="coin" id="coin">🪙</div>
  <div class="leaderboard">
    <h3>🏆 लाइव टॉप 10 लीडरबोर्ड</h3>
    <div class="row"><span>🥇 1. Player_One</span><span>15,000 pts</span></div>
    <div class="row"><span>🥈 2. Pro_Gamer</span><span>12,400 pts</span></div>
    <div class="row"><span>🥉 3. Star_Boy</span><span>9,800 pts</span></div>
    <div class="row"><span>4 से 10. अन्य खिलाड़ी</span><span>~5,000 pts</span></div>
  </div>
  <script>
    let score = 0;
    const scoreText = document.getElementById('score');
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
    document.getElementById('coin').addEventListener('pointerdown', () => {
      score++;
      scoreText.innerText = score;
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
      }
    });
  </script>
</body>
</html>
