<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Color Prediction Game UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .game-container {
      width: 100%;
      max-width: 420px;
      background-color: #111827;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    /* Timer Card */
    .timer-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }
    .timer-card h3 {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .timer-display {
      font-size: 32px;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 2px;
    }
    /* History Table */
    .history-header {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      color: #94a3b8;
      font-size: 14px;
      border-bottom: 1px solid #1f2937;
      margin-bottom: 8px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 480px;
      overflow-y: auto;
    }
    .row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background-color: #1e293b;
      border-radius: 8px;
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .col-number {
      font-size: 24px;
      font-weight: 800;
      width: 40px;
    }
    .col-size {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
      text-align: center;
    }
    .col-color {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      width: 60px;
    }
    /* Dots */
    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
    }
    .bg-green { background-color: #22c55e; }
    .bg-red { background-color: #ef4444; }
    .bg-violet { background-color: #a855f7; }
    
    .text-green { color: #22c55e; }
    .text-red { color: #ef4444; }
    .text-violet-mix { color: #ec4899; }
  </style>
</head>
<body>

<div class="game-container">
  <!-- Timer Box -->
  <div class="timer-card">
    <h3>अगला परिणाम आने में समय</h3>
    <div class="timer-display" id="timer">00:30</div>
  </div>

  <!-- Header -->
  <div class="history-header">
    <span>नंबर</span>
    <span>साइज</span>
    <span>कलर</span>
  </div>

  <!-- Result List -->
  <div class="history-list" id="historyList">
    <!-- रैंडम रिजल्ट यहाँ अपने आप जुड़ेंगे -->
  </div>
</div>

<script>
  let timeLeft = 30;
  const timerElement = document.getElementById('timer');
  const historyList = document.getElementById('historyList');

  // नया रैंडम रिजल्ट बनाने का लॉजिक
  function generateRandomResult() {
    // 0 से 9 तक रैंडम नंबर
    const num = Math.floor(Math.random() * 10);
    
    // 5 या उससे ऊपर Big, बाकी Small
    const size = num >= 5 ? 'Big' : 'Small';

    let numClass = '';
    let colorDots = '';

    // गेम के नियम अनुसार कलर लॉजिक
    if (num === 0) {
      numClass = 'text-violet-mix';
      colorDots = '<span class="dot bg-red"></span><span class="dot bg-violet"></span>';
    } else if (num === 5) {
      numClass = 'text-violet-mix';
      colorDots = '<span class="dot bg-green"></span><span class="dot bg-violet"></span>';
    } else if ([1, 3, 7, 9].includes(num)) {
      numClass = 'text-green';
      colorDots = '<span class="dot bg-green"></span>';
    } else {
      numClass = 'text-red';
      colorDots = '<span class="dot bg-red"></span>';
    }

    // नया रिकॉर्ड सबसे ऊपर ऐड करना
    const row = document.createElement('div');
    row.className = 'row-item';
    row.innerHTML = `
      <div class="col-number ${numClass}">${num}</div>
      <div class="col-size">${size}</div>
      <div class="col-color">${colorDots}</div>
    `;

    historyList.prepend(row);
  }

  // शुरुआत में कुछ डमी रिजल्ट्स लोड करना
  for (let i = 0; i < 5; i++) {
    generateRandomResult();
  }

  // 30 सेकंड का ऑटोमैटिक टाइमर लूप
  setInterval(() => {
    timeLeft--;

    if (timeLeft < 0) {
      generateRandomResult();
      timeLeft = 30; // वापस 30 सेकंड पर सेट
    }

    const formattedSeconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
    timerElement.innerText = `00:${formattedSeconds}`;
  }, 1000);
</script>

</body>
</html>
