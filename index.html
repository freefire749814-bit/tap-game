<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Game UI with Admin Preset</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b111e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 16px;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      background-color: #121927;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #1e293b;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .period-box h4, .timer-box h4 {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .period-id {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 2px;
    }
    .timer-digits {
      font-size: 26px;
      font-weight: 800;
      color: #facc15;
    }
    .table-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1.2fr 1.2fr;
      padding: 10px 12px;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 6px;
    }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
    }
    .record-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1.2fr 1.2fr;
      align-items: center;
      padding: 10px 12px;
      background-color: #1a2234;
      border-radius: 10px;
      border: 1px solid #243048;
    }
    .rec-period { font-size: 13px; color: #94a3b8; }
    .rec-number { font-size: 20px; font-weight: 800; text-align: center; }
    .rec-size { font-size: 14px; font-weight: 700; text-align: center; }
    .rec-colors { display: flex; gap: 5px; justify-content: flex-end; }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .c-green { background-color: #10b981; color: #10b981; }
    .c-red { background-color: #ef4444; color: #ef4444; }
    .c-violet { background-color: #a855f7; color: #a855f7; }
    .c-violet-mix { color: #ec4899; }

    /* Admin Panel Styling */
    .admin-panel {
      width: 100%;
      max-width: 440px;
      background-color: #162032;
      border: 1px dashed #38bdf8;
      border-radius: 12px;
      padding: 14px;
    }
    .admin-panel h3 {
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .admin-panel input {
      width: 100%;
      padding: 8px 10px;
      background-color: #0b111e;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .admin-panel button {
      width: 100%;
      padding: 8px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .queue-preview {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <div class="period-box">
      <h4>Period</h4>
      <div class="period-id" id="currentPeriod">Loading...</div>
    </div>
    <div class="timer-box">
      <h4>Time Remaining</h4>
      <div class="timer-digits" id="timer">00:30</div>
    </div>
  </div>

  <div class="table-header">
    <div>Period</div>
    <div class="text-center">Number</div>
    <div class="text-center">Size</div>
    <div class="text-right">Color</div>
  </div>

  <div class="records-list" id="recordsList"></div>
</div>

<!-- Admin Pre-set Control -->
<div class="admin-panel">
  <h3>Admin: अगले 5 राउंड्स का रिजल्ट पहले से तय करें</h3>
  <input type="text" id="presetInput" placeholder="जैसे: 7, 2, 9, 4, 1 (कॉमा लगाकर)">
  <button onclick="savePresetQueue()">क्यू में सेव करें (Set Queue)</button>
  <div class="queue-preview" id="queueStatus">क्यू में अभी: ऑटोमैटिक रैंडम मोड</div>
</div>

<script>
  let seconds = 30;
  let periodSequence = 101;
  let presetQueue = []; // अगले राउंड्स के नंबर यहाँ स्टोर होंगे

  const timerElem = document.getElementById('timer');
  const periodElem = document.getElementById('currentPeriod');
  const recordsList = document.getElementById('recordsList');
  const queueStatus = document.getElementById('queueStatus');

  function savePresetQueue() {
    const inputVal = document.getElementById('presetInput').value;
    if (inputVal.trim() !== '') {
      presetQueue = inputVal.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n >= 0 && n <= 9);
      queueStatus.innerText = "अगले आने वाले नंबर: " + presetQueue.join(', ');
      document.getElementById('presetInput').value = '';
    }
  }

  function getPeriodString(seq) {
    const d = new Date();
    const ymd = d.getFullYear().toString() +
      String(d.getMonth() + 1).padStart(2, '0') +
      String(d.getDate()).padStart(2, '0');
    return ymd + String(seq).padStart(4, '0');
  }

  function updateCurrentPeriodDisplay() {
    periodElem.innerText = getPeriodString(periodSequence);
  }

  function createNewRoundResult() {
    let num;
    // अगर एडमिन ने पहले से नंबर सेट कर रखा है तो वह निकलेगा, नहीं तो रैंडम
    if (presetQueue.length > 0) {
      num = presetQueue.shift();
      queueStatus.innerText = presetQueue.length > 0 ? "बाकी बचे नंबर: " + presetQueue.join(', ') : "क्यू खत्म, अब रैंडम चलेगा";
    } else {
      num = Math.floor(Math.random() * 10);
    }

    const size = num >= 5 ? 'Big' : 'Small';
    let numClass = '';
    let dotsHtml = '';

    if (num === 0) {
      numClass = 'c-violet-mix';
      dotsHtml = '<span class="color-dot c-red"></span><span class="color-dot c-violet"></span>';
    } else if (num === 5) {
      numClass = 'c-violet-mix';
      dotsHtml = '<span class="color-dot c-green"></span><span class="color-dot c-violet"></span>';
    } else if ([1, 3, 7, 9].includes(num)) {
      numClass = 'c-green';
      dotsHtml = '<span class="color-dot c-green"></span>';
    } else {
      numClass = 'c-red';
      dotsHtml = '<span class="color-dot c-red"></span>';
    }

    const completedPeriod = getPeriodString(periodSequence);
    const row = document.createElement('div');
    row.className = 'record-row';
    row.innerHTML = `
      <div class="rec-period">${completedPeriod}</div>
      <div class="rec-number ${numClass}">${num}</div>
      <div class="rec-size">${size}</div>
      <div class="rec-colors">${dotsHtml}</div>
    `;

    recordsList.prepend(row);
    periodSequence++;
    updateCurrentPeriodDisplay();
  }

  updateCurrentPeriodDisplay();
  for (let i = 0; i < 3; i++) {
    createNewRoundResult();
  }

  setInterval(() => {
    seconds--;
    if (seconds < 0) {
      createNewRoundResult();
      seconds = 30;
    }
    const formattedSec = seconds < 10 ? '0' + seconds : seconds;
    timerElem.innerText = `00:${formattedSec}`;
  }, 1000);
</script>

</body>
</html>
